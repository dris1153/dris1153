name: Profile README assets

on:
  # Daily refresh
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PICO-8 palette, matching the pixel art in assets/
      CARD_DARK: bg_color=1d2b53&title_color=ffec27&icon_color=ff004d&text_color=fff1e8&ring_color=ff004d&border_color=000000&border_radius=0
      CARD_LIGHT: bg_color=fff1e8&title_color=7e2553&icon_color=ff004d&text_color=1d2b53&ring_color=ff004d&border_color=1d2b53&border_radius=0
      STATS_OPTIONS: show_icons=true&include_all_commits=true&rank_icon=github
      LANGS_OPTIONS: layout=compact&langs_count=8
    steps:
      # README_STATS_TOKEN is an optional PAT (read:user + repo) that adds private
      # contributions; without it the cards fall back to public data only.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&${{ env.CARD_DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&${{ env.CARD_LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTIONS }}&${{ env.CARD_DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTIONS }}&${{ env.CARD_LIGHT }}
          path: dist/top-langs-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Runs after the card steps: snk is a Docker action running as root, so a
      # dist/ it creates first is not writable by the later (non-root) steps.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#008751&color_dots=#ebedf0,#ffccaa,#ff77a8,#ff004d,#7e2553
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e436&color_dots=#161b22,#7e2553,#ff004d,#ffa300,#ffec27

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update profile README assets [skip ci]"
