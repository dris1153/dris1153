name: Profile README assets

on:
  # Daily refresh
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Card palettes matching assets/header.svg
      CARD_DARK: bg_color=0d1117&title_color=c084fc&icon_color=22d3ee&text_color=c9d1d9&ring_color=c084fc&border_color=30363d&border_radius=12
      CARD_LIGHT: bg_color=ffffff&title_color=7c3aed&icon_color=0891b2&text_color=24292f&ring_color=7c3aed&border_color=d0d7de&border_radius=12
      STATS_OPTIONS: show_icons=true&include_all_commits=true&rank_icon=github
      LANGS_OPTIONS: layout=compact&langs_count=8
    steps:
      # README_STATS_TOKEN is an optional PAT (read:user + repo) that adds private
      # contributions; without it the cards fall back to public data only.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&${{ env.CARD_DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&${{ env.CARD_LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTIONS }}&${{ env.CARD_DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTIONS }}&${{ env.CARD_LIGHT }}
          path: dist/top-langs-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Runs after the card steps: snk is a Docker action running as root, so a
      # dist/ it creates first is not writable by the later (non-root) steps.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0891b2&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#581c87
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c084fc

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update profile README assets [skip ci]"
